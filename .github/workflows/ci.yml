# Tests and a production build for pull requests and feature branches.
#
# Publishing lives in deploy.yml, which runs these same checks on main before
# releasing to GitHub Pages. A host that builds from source itself (Cloudflare
# Pages, Netlify, Vercel) can be pointed at this repo instead and needs neither
# workflow — netlify.toml and vercel.json are set up for that.
name: CI

on:
  push:
    branches-ignore: [main]   # main is covered by the deploy workflow
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Refresh the shipped player pool so a deploy carries current players.
      # Non-fatal: if Sleeper is unreachable the committed pool is used instead.
      - run: npm run players:build || echo "using committed player pool"
      - run: npm run build
      # Downloadable so the site can be published by drag-and-drop with no
      # account linking at all.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
