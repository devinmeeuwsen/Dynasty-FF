# Publishes the app to GitHub Pages, which is all it takes to make live Sleeper
# sync work: Sleeper's API sends `access-control-allow-origin: *`, so any
# ordinary origin may call it straight from the browser. No backend, no proxy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/modern-web-app-design-hazfgl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Refresh the shipped player pool so each deploy carries current players.
      # Non-fatal: if Sleeper is unreachable the committed pool is used instead.
      - run: npm run players:build || echo "using committed player pool"
      - run: npm run build
      # `enablement` turns Pages on via the API if it is not already, which
      # removes the chicken-and-egg where the first run cannot find a Pages site.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Build and test run on every branch; only the default branch publishes, since
  # the github-pages environment restricts deployments to it.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
