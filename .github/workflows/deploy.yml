# Publishes the app to GitHub Pages. Free now that the repository is public.
#
# Live Sleeper sync needs nothing more than this: Sleeper's API sends
# `access-control-allow-origin: *`, so the built bundle calls it straight from
# the visitor's browser. No backend, no proxy, no database.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running publish finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Once against the committed data, so a failure here means the code
      # broke rather than an upstream source changing shape under us.
      - run: npm test
      # Refresh the shipped data so each deploy carries current players and a
      # current KeepTradeCut board. Both are non-fatal: if a source is
      # unreachable the committed snapshot is used instead, and the build still
      # produces a working site with slightly staler numbers.
      - run: npm run players:build || echo "using committed player pool"
      - run: npm run rankings:build || echo "using committed ranking snapshot"
      # Re-run the suite against whatever those two just wrote. The snapshot
      # tests assert board depth, the superflex quarterback premium and clean
      # name matching, so a source that changes shape fails here rather than
      # shipping wrong numbers.
      - run: npm test
      - run: npm run build
      # One-time setup: Settings -> Pages -> Source: "GitHub Actions".
      # `enablement: true` is deliberately not used here — the workflow's
      # GITHUB_TOKEN is not permitted to create a Pages site, so it fails with
      # "Resource not accessible by integration" whatever the repo visibility.
      # Creating the site needs either that one click or a PAT with admin scope.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
